[versions]
agp = "9.3.3"
kotlin = "2.4.10"
ksp = "2.3.12"
composeBom = "2025.05.01"
activity = "1.10.1"
lifecycle = "2.9.1"
navigation = "2.9.0"
coroutines = "1.10.2"
hilt = "2.60.1"
hiltNavigation = "1.3.0"
room = "2.7.2"
datastore = "1.1.7"
work = "2.10.2"
camera = "1.4.2"
core = "1.16.0"
okhttp = "4.12.0"
vosk = "0.3.75"
onnxRuntime = "1.30.0"
litertLm = "0.17.1"
